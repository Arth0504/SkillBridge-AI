name: Continuous Deployment (CD) & Production Registry Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  publish-production-images:
    name: Build & Push Multi-Service Docker Images to GHCR & Docker Hub
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Missing required Docker Hub secrets: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN."
            exit 1
          fi
          echo "✅ Required GitHub Action secrets present."

      - name: Downcase Repository Owner & Construct Names
        id: repo
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=${OWNER}" >> $GITHUB_OUTPUT
          echo "✅ Converted repository owner to lowercase: ${OWNER}"

      - name: Extract Docker Metadata for Backend Service
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.repo.outputs.OWNER }}/skillbridge-backend
            ${{ secrets.DOCKERHUB_USERNAME }}/skillbridge-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Extract Docker Metadata for AI Service
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.repo.outputs.OWNER }}/skillbridge-ai-service
            ${{ secrets.DOCKERHUB_USERNAME }}/skillbridge-ai-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Node.js Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push FastAPI AI Service Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Digests in Registries
        run: |
          echo "Verifying pushed backend images..."
          for tag in ${{ steps.meta-backend.outputs.tags }}; do
            echo "Inspecting manifest for: $tag"
            docker buildx imagetools inspect "$tag" || { echo "::error::Manifest inspection failed for $tag"; exit 1; }
          done

          echo "Verifying pushed AI service images..."
          for tag in ${{ steps.meta-ai.outputs.tags }}; do
            echo "Inspecting manifest for: $tag"
            docker buildx imagetools inspect "$tag" || { echo "::error::Manifest inspection failed for $tag"; exit 1; }
          done

          echo "✅ All production images verified successfully."
