name: Continuous Deployment (CD) & Production Registry Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  publish-production-images:
    name: Build & Push Multi-Service Docker Images to GHCR & Docker Hub
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Container Registries Configuration
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_ENABLED=true" >> $GITHUB_ENV
            echo "✅ Docker Hub credentials detected. Dual publishing (GHCR + Docker Hub) enabled."
          else
            echo "DOCKERHUB_ENABLED=false" >> $GITHUB_ENV
            echo "ℹ️ Docker Hub secrets omitted. Publishing target: GitHub Container Registry (GHCR) only."
          fi

      - name: Downcase Repository Owner & Construct Names
        id: repo
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=${OWNER}" >> $GITHUB_OUTPUT

          BACKEND_IMAGES="ghcr.io/${OWNER}/skillbridge-backend"
          AI_IMAGES="ghcr.io/${OWNER}/skillbridge-ai-service"

          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            BACKEND_IMAGES="${BACKEND_IMAGES}
${{ secrets.DOCKERHUB_USERNAME }}/skillbridge-backend"
            AI_IMAGES="${AI_IMAGES}
${{ secrets.DOCKERHUB_USERNAME }}/skillbridge-ai-service"
          fi

          echo "backend_images<<EOF" >> $GITHUB_OUTPUT
          echo "${BACKEND_IMAGES}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "ai_images<<EOF" >> $GITHUB_OUTPUT
          echo "${AI_IMAGES}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract Docker Metadata for Backend Service
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.backend_images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Extract Docker Metadata for AI Service
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.ai_images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Node.js Backend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push FastAPI AI Service Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Digests in Registries
        run: |
          echo "Verifying pushed backend images..."
          for tag in ${{ steps.meta-backend.outputs.tags }}; do
            echo "Inspecting manifest for: $tag"
            docker buildx imagetools inspect "$tag" || { echo "::error::Manifest inspection failed for $tag"; exit 1; }
          done

          echo "Verifying pushed AI service images..."
          for tag in ${{ steps.meta-ai.outputs.tags }}; do
            echo "Inspecting manifest for: $tag"
            docker buildx imagetools inspect "$tag" || { echo "::error::Manifest inspection failed for $tag"; exit 1; }
          done

          echo "✅ All production images verified successfully."
