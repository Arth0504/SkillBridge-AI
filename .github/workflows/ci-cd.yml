name: SkillBridge AI Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Production Build Verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Backend Server Dependencies
        run: |
          cd server
          npm ci

      - name: Execute QA Integration Test Suite
        run: |
          cd server
          node test_ai_resume_builder_qa.js
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/skillbridge_test
          JWT_SECRET: test_jwt_secret

      - name: Install Client Dependencies & Build Production Bundle
        run: |
          cd client
          npm ci
          npm run build

      - name: Build Docker Production Container
        run: |
          docker build -t skillbridge-ai:latest .
