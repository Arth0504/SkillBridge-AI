name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-node-backend:
    name: Node.js Backend CI & Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Node.js Dependencies
        run: |
          cd server
          npm ci

      - name: Run ESLint & Format Verification
        run: |
          cd server
          npm run lint --if-present

      - name: Run Backend Integration & Production Tests
        env:
          PORT: 5099
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/skillbridge_test
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/skillbridge_test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: super_secret_jwt_access_key_skillbridge_2026
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_skillbridge_2026
        run: |
          cd server
          node test_production_module.js
          node test_security_module.js

  test-fastapi-ai-service:
    name: Python FastAPI AI Microservice CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI App Initialization
        run: |
          cd ai-service
          python -c "from app import app; print('FastAPI App Initialized Successfully')"

  docker-build-verification:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [test-node-backend, test-fastapi-ai-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node.js Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false

      - name: Build FastAPI AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
