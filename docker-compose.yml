version: '3.8'

services:
  # 1. MongoDB Database Cluster Service
  mongodb:
    image: mongo:7.0
    container_name: skillbridge-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: skillbridge
    volumes:
      - mongo_data:/data/db

  # 2. Redis Caching & Socket Store Service
  redis:
    image: redis:7-alpine
    container_name: skillbridge-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Node.js Backend Server & Socket.IO
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/skillbridge
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_jwt_super_secret_key_skillbridge_2026
      JWT_REFRESH_SECRET: production_refresh_secret_key_skillbridge_2026
      CLIENT_URL: http://localhost:80
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - mongodb
      - redis
      - ai-service

  # 4. FastAPI AI Microservice (Gemini LLM Integration)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: skillbridge-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENVIRONMENT: production

  # 5. Nginx Reverse Proxy Container
  nginx:
    image: nginx:alpine
    container_name: skillbridge-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

volumes:
  mongo_data:
