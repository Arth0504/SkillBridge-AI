version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillbridge_backend
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    networks:
      - skillbridge_network

networks:
  skillbridge_network:
    driver: bridge
